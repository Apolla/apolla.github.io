name: Build and Deploy Hugo

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch FixIt theme
        run: |
          set -e
          THEME_SHA=48384b8
          rm -rf themes/FixIt
          mkdir -p themes/FixIt
          cd themes/FixIt
          git init -q
          git remote add origin https://github.com/hugo-fixit/FixIt.git
          git fetch -q --depth 1 origin ${THEME_SHA}
          git checkout -q FETCH_HEAD
          ls layouts >/dev/null
          cd ../..

      - name: Install Hugo 0.170.0
        run: |
          set -e
          V=0.170.0
          for name in "hugo_extended_${V}_linux-amd64.tar.gz" "hugo_${V}_linux-amd64.tar.gz"; do
            url="https://github.com/gohugoio/hugo/releases/download/v${V}/${name}"
            echo "trying $url"
            if curl -fsSL -o hugo.tgz "$url"; then break; fi
          done
          mkdir -p "$HOME/.local/bin"
          tar -xzf hugo.tgz -C "$HOME/.local/bin" hugo
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/hugo" version

      - name: Install Dart Sass
        run: |
          sudo npm install -g sass@1.93.2
          sass --version

      - name: Build site
        run: |
          hugo --gc --minify --logLevel warn
          test -f public/index.html
          test -f public/CNAME

      - name: Deploy to main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
          force_orphan: true
