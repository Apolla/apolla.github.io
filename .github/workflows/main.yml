name: Build and Deploy Hugo

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch FixIt theme
        run: |
          set -e
          rm -rf themes/FixIt
          git clone -q --depth 1 --branch main https://github.com/hugo-fixit/FixIt.git themes/FixIt
          cd themes/FixIt && echo "theme commit: $(git rev-parse --short HEAD)" && cd ../..

      - name: Install Hugo 0.170.0
        run: |
          set -e
          V=0.170.0
          for name in "hugo_extended_${V}_linux-amd64.tar.gz" "hugo_${V}_linux-amd64.tar.gz"; do
            url="https://github.com/gohugoio/hugo/releases/download/v${V}/${name}"
            echo "trying $url"
            if curl -fsSL -o hugo.tgz "$url"; then break; fi
          done
          mkdir -p "$HOME/.local/bin"
          tar -xzf hugo.tgz -C "$HOME/.local/bin" hugo
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/hugo" version

      - name: Install Dart Sass (standalone)
        run: |
          set -e
          SV=1.93.2
          url="https://github.com/sass/dart-sass/releases/download/${SV}/dart-sass-${SV}-linux-x64.tar.gz"
          curl -fsSL -o sass.tgz "$url"
          mkdir -p "$HOME/.local/bin"
          tar -xzf sass.tgz
          cp dart-sass/sass "$HOME/.local/bin/sass"
          chmod +x "$HOME/.local/bin/sass"
          ls -l "$HOME/.local/bin/sass"
          "$HOME/.local/bin/sass" --version

      - name: Build site
        id: build
        run: |
          set -o pipefail
          hugo --gc --minify --logLevel warn
          test -f public/index.html
          test -f public/CNAME
          echo "BUILD OK"

      - name: Deploy to main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
          force_orphan: true
