name: Build and Deploy Hugo

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch FixIt theme
        run: |
          set -e
          rm -rf themes/FixIt
          git clone -q --depth 1 --branch main https://github.com/hugo-fixit/FixIt.git themes/FixIt
          cd themes/FixIt && echo "theme commit: $(git rev-parse --short HEAD)" && cd ../..

      - name: Install Hugo and Dart Sass
        run: |
          set -x
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/diag"
          V=0.170.0
          for name in "hugo_extended_${V}_linux-amd64.tar.gz" "hugo_${V}_linux-amd64.tar.gz"; do
            if curl -fsSL --retry 3 -o hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${V}/${name}"; then
              echo "hugo asset: $name"
              break
            fi
          done
          tar -xzf hugo.tgz -C "$HOME/.local/bin" hugo
          SV=1.93.2
          curl -fsSL --retry 3 -o sass.tgz "https://github.com/sass/dart-sass/releases/download/${SV}/dart-sass-${SV}-linux-x64.tar.gz"
          tar -xzf sass.tgz
          ls -l dart-sass | head -5
          cp dart-sass/sass "$HOME/.local/bin/sass"
          chmod +x "$HOME/.local/bin/sass"
          "$HOME/.local/bin/hugo" version | tee "$RUNNER_TEMP/diag/versions.txt"
          "$HOME/.local/bin/sass" --version | tee -a "$RUNNER_TEMP/diag/versions.txt"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build site
        id: build
        run: |
          set -o pipefail
          hugo --gc --minify --logLevel warn 2>&1 | tee "$RUNNER_TEMP/diag/build.log"
          test -f public/index.html
          test -f public/CNAME
          echo "BUILD OK" | tee -a "$RUNNER_TEMP/diag/build.log"

      - name: Publish diagnostics
        if: always() && github.ref == 'refs/heads/source'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/diag
          publish_branch: ci-log
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "diag: ${{ github.sha }}"
          force_orphan: true

      - name: Deploy to main
        if: steps.build.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
          force_orphan: true
